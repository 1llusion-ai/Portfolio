<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Course Agent architecture</title><desc id="desc">Question routing, evidence retrieval, controlled teaching tools, answer generation and learner-memory feedback. Dashed amber panel describes the in-progress routing refactor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#4c5c6d"/></marker></defs><style>text{font-family:'IBM Plex Sans','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#253343}.title{font-size:30px;font-weight:600}.heading{font-size:21px;font-weight:600}.body{font-size:17px}.small{font-size:15px;fill:#617184}.panel{fill:#fafbfd;stroke:#ced6df;stroke-width:1.5}.edge{fill:none;stroke:#4c5c6d;stroke-width:1.8;marker-end:url(#arrow)}.feedback{fill:none;stroke:#4c5c6d;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect width="1600" height="1050" fill="white"/>
