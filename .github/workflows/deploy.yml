# Deploys the static site to GitHub Pages.
#
# BASE_PATH is the GitHub Pages sub-path. It is derived from the repository
# name at build time so you do not need to edit this file:
#
#   · Project site (owner/<repo-name>)  → BASE_PATH=/<repo-name>/
#       (this is the default this workflow computes)
#   · User/org site (owner.github.io)   → BASE_PATH=/
#       If your repo is a user/org site, change the Build step's BASE_PATH to '/'
#       and the Pages environment URL accordingly.
#
# Locally, the equivalent is:  BASE_PATH=/<repo-name>/ npm run build
# (or just `npm run build`, which defaults to '/').

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Set to '/' for a user/org site (owner.github.io).
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.event.repository.owner.login }}.github.io

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
